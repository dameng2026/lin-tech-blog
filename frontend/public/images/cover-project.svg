<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e2de2"/>
      <stop offset="50%" style="stop-color:#4a00e0"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="150" r="250" fill="url(#glow1)"/>
  <circle cx="150" cy="480" r="180" fill="#ffffff" opacity="0.04"/>
  <!-- Star/project icon -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="70" fill="#ffffff" opacity="0.2">✦</text>
  <!-- Decorative shapes -->
  <rect x="250" y="340" width="80" height="80" rx="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" transform="rotate(15,290,380)"/>
  <rect x="380" y="360" width="60" height="60" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08" transform="rotate(-10,410,390)"/>
  <rect x="500" y="340" width="50" height="50" rx="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12" transform="rotate(20,525,365)"/>
  <!-- Tech dots -->
  <circle cx="200" cy="150" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="450" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="150" cy="150" r="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="700" cy="250" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="300" cy="120" r="2" fill="#ffffff" opacity="0.15"/>
</svg>