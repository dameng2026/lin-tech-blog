<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f12711"/>
      <stop offset="100%" style="stop-color:#f5af19"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="120" r="250" fill="url(#glow1)"/>
  <circle cx="150" cy="480" r="180" fill="#ffffff" opacity="0.05"/>
  <!-- Tool icons -->
  <rect x="300" y="175" width="200" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="300" y="195" width="170" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
  <rect x="300" y="215" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="300" y="235" width="140" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
  <!-- Gear/wrench icon -->
  <circle cx="400" cy="320" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  <circle cx="400" cy="320" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
  <line x1="400" y1="290" x2="400" y2="280" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <line x1="400" y1="350" x2="400" y2="360" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <line x1="370" y1="320" x2="360" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <line x1="430" y1="320" x2="440" y2="320" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <!-- Pencil icon -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#ffffff" opacity="0.15">✎</text>
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="520" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="120" cy="520" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="680" cy="80" r="2" fill="#ffffff" opacity="0.25"/>
</svg>