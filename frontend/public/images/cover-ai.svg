<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="150" r="200" fill="url(#glow1)"/>
  <circle cx="200" cy="450" r="150" fill="#ffffff" opacity="0.05"/>
  <!-- Neural network nodes -->
  <circle cx="400" cy="200" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="300" r="25" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="500" cy="280" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="350" cy="400" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="480" cy="380" r="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <circle cx="550" cy="200" r="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <!-- Connection lines -->
  <line x1="400" y1="240" x2="300" y2="275" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="400" y1="240" x2="500" y2="250" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="300" y1="325" x2="350" y2="380" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="500" y1="310" x2="480" y2="365" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="400" y1="240" x2="550" y2="182" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <!-- Center AI icon -->
  <text x="400" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="60" font-weight="bold" fill="#ffffff" opacity="0.8">AI</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" opacity="0.5">Artificial Intelligence</text>
  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="500" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="150" cy="500" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="680" cy="100" r="2" fill="#ffffff" opacity="0.25"/>
</svg>