<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#36d1dc"/>
      <stop offset="100%" style="stop-color:#5b86e5"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="120" r="250" fill="url(#glow1)"/>
  <circle cx="200" cy="500" r="180" fill="#ffffff" opacity="0.05"/>
  <!-- Code brackets -->
  <text x="350" y="220" text-anchor="middle" font-family="monospace" font-size="80" font-weight="bold" fill="#ffffff" opacity="0.15">&lt;/&gt;</text>
  <!-- HTML tag lines -->
  <rect x="250" y="280" width="120" height="6" rx="3" fill="#ffffff" opacity="0.2"/>
  <rect x="250" y="300" width="200" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="270" y="320" width="160" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
  <rect x="250" y="340" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
  <rect x="430" y="280" width="120" height="6" rx="3" fill="#ffffff" opacity="0.2"/>
  <rect x="430" y="300" width="80" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <!-- Brackets { } -->
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="50" fill="#ffffff" opacity="0.12">{ }</text>
  <!-- Decorative -->
  <circle cx="100" cy="100" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="720" cy="520" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="150" cy="480" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="680" cy="80" r="2" fill="#ffffff" opacity="0.25"/>
</svg>